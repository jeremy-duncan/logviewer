# /etc/logviewer/logviewer.conf

[server]
# "::" listens on IPv6 and IPv4 (dual stack). Use 0.0.0.0 for IPv4 only.
listen = ::
port = 8443
# TLS is required unless allow_plain_http = yes (only for a TLS-terminating proxy).
tls_cert = /etc/logviewer/tls/server.crt
tls_key = /etc/logviewer/tls/server.key
allow_plain_http = no

[logs]
# Every file whose name ends in .log under this directory is listed.
directory = /var/log
recursive = yes
# Extra files to include even though they do not end in .log, relative to
# the directory above and comma separated. Ubuntu's main log is "syslog".
include_names =

[auth]
# Created and managed with: logviewer.py adduser NAME
users_file = /etc/logviewer/users

[limits]
# Most records one search can return.
max_results = 2000
# A search gives up after this many seconds or this many lines in total.
search_timeout = 15
max_scan_lines = 5000000
# Most live (tail) streams open at once.
max_streams = 20
